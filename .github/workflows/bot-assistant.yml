name: Profile Bot Assistant

on:
  issues:
    types: [opened]

jobs:
  respond_and_update:
    if: contains(github.event.issue.labels.*.name, 'bot-assistant')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-with-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai

      - name: Run Bot Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          USER_NAME: ${{ github.event.issue.user.login }}
        run: |
          python .github/scripts/bot_brain.py

      - name: Commit & Push README changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "🤖 Bot updated conversation history" || echo "No changes to commit"
          git push

      - name: Close Issue with Reply
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reply = fs.readFileSync('bot_reply.txt', 'utf8');
            
            // Post the bot's response inside the issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reply
            });

            // Close the issue automatically to keep things clean
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['bot-assistant', 'processed']
            });
